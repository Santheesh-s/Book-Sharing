<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Book - Student Marketplace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        fetch(API_BASE_URL + '/api/user', { headers: authHeaders() })
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) window.location.href = '/login.html';
            });
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="/home.html">
                <span>🎓 Campus<span class="highlight">BookShare</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/books.html">Browse Marketplace</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/add-book.html">Post a Book</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
                </ul>
                <span class="navbar-text fw-semibold" id="userInfo"></span>
            </div>
        </div>
    </nav>

    <div class="container my-4" style="max-width: 650px;">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white text-center py-3">
                <h3 class="mb-1 fs-4 fw-bold">📖 Post a Textbook to Sell or Lend</h3>
                <p class="mb-0 small text-white-50">Share with students across your campus</p>
            </div>
            <div class="card-body p-4">
                <div id="addBookAlert"></div>

                <form method="POST" action="" id="addBookForm" autocomplete="off">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-secondary">Listing Type <span class="text-danger">*</span></label>
                        <select name="listingType" id="listingTypeSelect" class="form-select" onchange="togglePrice(this.value)">
                            <option value="Lend" selected>🤝 Free Lending / Borrow</option>
                            <option value="Sale">💰 Sell Book (Set Price in ₹)</option>
                        </select>
                    </div>

                    <div class="mb-3 d-none" id="priceGroup">
                        <label class="form-label fw-bold small text-uppercase text-secondary">Selling Price (₹) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text fw-bold">₹</span>
                            <input name="price" id="priceInput" type="number" min="0" step="1" class="form-control" placeholder="e.g. 150">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-secondary">Book Title <span class="text-danger">*</span></label>
                        <input name="title" class="form-control" placeholder="e.g. Engineering Mathematics / Python Programming" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-secondary">Author <span class="text-danger">*</span></label>
                        <input name="author" class="form-control" placeholder="e.g. Veerarajan / Reema Thareja" autocomplete="off" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-secondary">Department / Stream</label>
                            <select name="department" class="form-select">
                                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics & Communication">Electronics & Communication</option>
                                <option value="Electrical Engineering">Electrical Engineering</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Basic Sciences & Maths">Basic Sciences & Maths</option>
                                <option value="Literature & Humanities">Literature & Humanities</option>
                                <option value="Competitive Exams">Competitive Exams (GATE/CAT/GRE)</option>
                                <option value="General">General</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-secondary">Condition</label>
                            <select name="condition" class="form-select">
                                <option value="Like New">Like New</option>
                                <option value="Good" selected>Good Condition</option>
                                <option value="Fair / Marked">Fair / Notes Written</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-secondary">College / Campus Location <span class="text-danger">*</span></label>
                        <input name="collegeName" id="collegeNameInput" class="form-control" placeholder="e.g. Kongu Engineering College" autocomplete="off" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase text-secondary">Description / Edition / Notes</label>
                        <textarea name="description" class="form-control" rows="3" placeholder="Mention semester, edition year, or preferred handover spot on campus..."></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" id="submitBtn" class="btn btn-success btn-lg fw-bold">🚀 Post Book Listing</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="text-center mt-3">
            <a href="/books.html" class="text-decoration-none small text-muted">← Back to Student Marketplace</a>
        </div>
    </div>

    <footer>
        <div class="container text-center">
            <p class="mb-0">🎓 CampusBookShare — Student-to-Student Textbook Sharing & Marketplace</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const addBookForm = document.getElementById('addBookForm');
        const addBookAlert = document.getElementById('addBookAlert');
        const submitBtn = document.getElementById('submitBtn');

        document.getElementById('logoutLink').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        function togglePrice(val) {
            const priceGroup = document.getElementById('priceGroup');
            const priceInput = document.getElementById('priceInput');
            if (val === 'Sale') {
                priceGroup.classList.remove('d-none');
                priceInput.required = true;
            } else {
                priceGroup.classList.add('d-none');
                priceInput.required = false;
                priceInput.value = '';
            }
        }

        window.addEventListener('pageshow', function () {
            if (addBookForm) addBookForm.reset();
            togglePrice('Lend');
        });

        addBookForm.addEventListener('submit', function (e) {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Posting listing...';
            addBookAlert.innerHTML = '';

            const formData = new FormData(addBookForm);
            const payload = Object.fromEntries(formData.entries());

            fetch(API_BASE_URL + '/books', {
                method: 'POST',
                headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(data => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🚀 Post Book Listing';

                    if (data.success) {
                        window.location.href = '/books.html';
                    } else {
                        addBookAlert.innerHTML = `<div class="alert alert-danger py-2">${data.error || 'Failed to list book.'}</div>`;
                    }
                })
                .catch(() => {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '🚀 Post Book Listing';
                    addBookAlert.innerHTML = '<div class="alert alert-danger py-2">Something went wrong. Please check your connection.</div>';
                });
        });

        fetch(API_BASE_URL + '/api/user', { headers: authHeaders() })
            .then(res => res.json())
            .then(data => {
                const userInfo = document.getElementById('userInfo');
                if (data.loggedIn) {
                    let name = data.fullName || 'Student';
                    const college = data.collegeName ? ` (${data.collegeName})` : '';
                    userInfo.textContent = `👤 ${name}${college}`;
                    
                    if (data.collegeName && document.getElementById('collegeNameInput')) {
                        document.getElementById('collegeNameInput').value = data.collegeName;
                    }
                }
            });
    </script>
</body>

</html>
