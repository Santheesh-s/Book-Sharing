<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Books - Student Marketplace</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script>
        fetch(API_BASE_URL + '/api/user', { headers: authHeaders() })
            .then(res => res.json())
            .then(data => {
                if (!data.loggedIn) window.location.href = '/login.html';
            });
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand" href="/home.html">
                <span>🎓 Campus<span class="highlight">BookShare</span></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/books.html">Browse Marketplace</a></li>
                    <li class="nav-item"><a class="nav-link" href="/add-book.html">Post a Book</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutLink">Logout</a></li>
                </ul>
                <span class="navbar-text fw-semibold" id="userInfo"></span>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h2 class="fw-bold mb-0 text-dark">📚 Student Textbook Marketplace</h2>
                <p class="text-muted small mb-0">Discover used semester books posted by fellow campus peers</p>
            </div>
            <a href="/add-book.html" class="btn btn-success fw-bold shadow-sm">+ Post a Book to Sell/Lend</a>
        </div>

        <div class="card p-3 shadow-sm mb-4 border-0 bg-white">
            <form id="searchForm" class="row g-2 align-items-center">
                <div class="col-md-5">
                    <input id="searchInput" type="text" class="form-control" placeholder="Search by title, author, subject, or campus...">
                </div>
                <div class="col-md-3">
                    <select id="departmentSelect" class="form-select">
                        <option value="All">All Departments</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Basic Sciences & Maths">Basic Sciences & Maths</option>
                        <option value="Literature & Humanities">Literature & Humanities</option>
                        <option value="Competitive Exams">Competitive Exams (GATE/CAT/GRE)</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select id="listingTypeSelect" class="form-select">
                        <option value="All">All Types</option>
                        <option value="Sale">💰 For Sale</option>
                        <option value="Lend">🤝 Free Lending</option>
                    </select>
                </div>
                <div class="col-md-2 d-grid">
                    <button type="submit" class="btn btn-primary fw-bold">Search Books</button>
                </div>
            </form>
        </div>

        <div id="booksLoading" class="text-center py-5 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted small mt-2">Loading marketplace books...</p>
        </div>

        <div id="booksList" class="row g-4"></div>
    </div>

    <footer>
        <div class="container text-center">
            <p class="mb-0">🎓 CampusBookShare — Student-to-Student Textbook Sharing & Marketplace</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentUserData = null;

        document.getElementById('logoutLink').addEventListener('click', function (e) {
            e.preventDefault();
            logout();
        });

        fetch(API_BASE_URL + '/api/user', { headers: authHeaders() })
            .then(res => res.json())
            .then(data => {
                currentUserData = data;
                const userInfo = document.getElementById('userInfo');
                if (data.loggedIn) {
                    let name = data.fullName || 'Student';
                    const college = data.collegeName ? ` (${data.collegeName})` : '';
                    userInfo.textContent = `👤 ${name}${college}`;
                }
                fetchBooks();
            });

        function renderBooks(books) {
            const list = document.getElementById('booksList');
            list.innerHTML = '';

            if (!books || books.length === 0) {
                list.innerHTML = `
                    <div class="col-12">
                        <div class="alert alert-light border text-center py-5 rounded-4 shadow-sm">
                            <h5 class="fw-bold text-dark">No book listings found</h5>
                            <p class="text-muted small mb-3">Try clearing search filters or be the first student to post a book!</p>
                            <a href="/add-book.html" class="btn btn-success btn-sm">+ Post a Book</a>
                        </div>
                    </div>
                `;
                return;
            }

            books.forEach(book => {
                const col = document.createElement('div');
                col.className = "col-md-6 col-lg-4";

                const isOwner = currentUserData && currentUserData.loggedIn && currentUserData.userId === String(book.ownerId);

                let ownerActions = '';
                if (isOwner) {
                    ownerActions = `
                        <div class="mt-2 pt-2 border-top d-flex justify-content-between align-items-center">
                            <span class="badge bg-dark">Your Listing</span>
                            <div>
                                ${!book.available ? `<button type="button" class="btn btn-outline-success btn-sm me-1" onclick="markAvailable('${book._id}')">Mark Available</button>` : ''}
                                <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteBook('${book._id}')">Delete</button>
                            </div>
                        </div>
                    `;
                }

                const ratingBadge = book.avgRating 
                    ? `<span class="badge bg-warning text-dark me-1">⭐ ${book.avgRating} / 5 (${book.reviewCount})</span>`
                    : `<span class="badge bg-light text-muted border me-1">No reviews</span>`;

                const typeBadge = (book.listingType === 'Sale')
                    ? `<span class="badge badge-sale fs-6">💰 ₹${book.price || 0}</span>`
                    : `<span class="badge badge-lend fs-6">🤝 Free Lend</span>`;

                const requestUrl = (book.listingType === 'Sale')
                    ? `/purchase.html?bookId=${book._id}`
                    : `/borrow.html?bookId=${book._id}`;

                const requestLabel = (book.listingType === 'Sale')
                    ? '🛒 Buy Book'
                    : '📖 Request Lend';

                const btnColor = (book.listingType === 'Sale') ? 'warning' : 'success';

                col.innerHTML = `
                    <div class="card h-100 shadow-sm border-0 rounded-4">
                        <div class="card-body d-flex flex-column p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2 gap-2">
                                <span class="badge badge-dept text-truncate" style="max-width: 170px;">${book.department || 'General'}</span>
                                <span class="badge bg-light text-secondary border">${book.condition || 'Good'}</span>
                            </div>

                            <div class="mb-2">${typeBadge}</div>

                            <h5 class="card-title mb-1 fw-bold text-dark">${book.title}</h5>
                            <h6 class="card-subtitle text-muted mb-3 small">by ${book.author}</h6>

                            <p class="card-text text-secondary small flex-grow-1">${book.description || 'Listed by student for semester study.'}</p>
                            
                            <div class="mb-3 small text-muted border-top pt-2">
                                <div>🏫 <strong>Campus:</strong> ${book.ownerCollege || 'College'}</div>
                                <div>👤 <strong>Student:</strong> ${book.ownerName || 'Student'}</div>
                                <div class="mt-1">${ratingBadge}</div>
                            </div>

                            <div class="mt-auto d-flex align-items-center justify-content-between pt-2 border-top">
                                <div>
                                    ${book.available ? `
                                        <a href="${requestUrl}" class="btn btn-${btnColor} btn-sm fw-bold">
                                            ${requestLabel}
                                        </a>
                                    ` : `<span class="badge bg-secondary">Taken / Sold</span>`}
                                </div>
                                <div>
                                    <a href="/review.html?bookId=${book._id}" class="btn btn-outline-secondary btn-sm">⭐ Review</a>
                                </div>
                            </div>

                            ${ownerActions}
                        </div>
                    </div>
                `;
                list.appendChild(col);
            });
        }

        function fetchBooks() {
            const query = document.getElementById('searchInput').value;
            const department = document.getElementById('departmentSelect').value;
            const listingType = document.getElementById('listingTypeSelect').value;

            let url = API_BASE_URL + '/search?q=' + encodeURIComponent(query);
            if (department !== 'All') url += '&department=' + encodeURIComponent(department);
            if (listingType !== 'All') url += '&listingType=' + encodeURIComponent(listingType);

            document.getElementById('booksLoading').classList.remove('d-none');

            fetch(url, { headers: authHeaders() })
                .then(res => res.json())
                .then(books => {
                    document.getElementById('booksLoading').classList.add('d-none');
                    renderBooks(books);
                })
                .catch(err => {
                    document.getElementById('booksLoading').classList.add('d-none');
                    console.error('Error fetching books:', err);
                });
        }

        function markAvailable(bookId) {
            if (!confirm('Mark this book as available again?')) return;
            fetch(API_BASE_URL + '/books/' + bookId + '/available', {
                method: 'POST',
                headers: authHeaders()
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        fetchBooks();
                    } else {
                        alert(data.error || 'Failed to update listing.');
                    }
                });
        }

        function deleteBook(bookId) {
            if (!confirm('Are you sure you want to delete this textbook listing?')) return;
            fetch(API_BASE_URL + '/books/' + bookId, {
                method: 'DELETE',
                headers: authHeaders()
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        fetchBooks();
                    } else {
                        alert(data.error || 'Failed to delete listing.');
                    }
                })
                .catch(() => alert('Could not delete listing.'));
        }

        document.getElementById('searchForm').onsubmit = function (e) {
            e.preventDefault();
            fetchBooks();
        };

        document.getElementById('departmentSelect').onchange = fetchBooks;
        document.getElementById('listingTypeSelect').onchange = fetchBooks;
    </script>
</body>

</html>
