<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Campus Book Share</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>

<body class="bg-light">
    <div class="container min-vh-100 d-flex justify-content-center align-items-center py-4">
        <div class="card shadow-lg border-0 rounded-3 p-4" style="max-width: 440px; width: 100%;">
            <div class="text-center mb-4">
                <h2 class="fw-bold text-primary mb-1">🎓 Reset Password</h2>
                <p class="text-muted small">Enter your student email to receive a reset code & link</p>
            </div>

            <div id="alertBox"></div>

            <div id="step1">
                <form id="forgotForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Student Email Address</label>
                        <input name="email" type="email" id="reqEmail" class="form-control" placeholder="student@college.edu" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" id="requestBtn" class="btn btn-warning btn-lg fw-bold">Send Reset Code & Link</button>
                    </div>
                </form>
            </div>

            <div id="step2" class="d-none">
                <div class="alert alert-info small mb-3" id="step2Notice">
                    ✉️ We've sent a 6-digit reset code and a direct link to your email. Please check your inbox (and spam folder).
                </div>
                <form id="resetForm">
                    <input type="hidden" name="email" id="resetEmail">
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">6-Digit Reset Code (from email)</label>
                        <input name="resetCode" id="resetCodeInput" type="text" class="form-control text-center fs-5 fw-bold letter-spacing-1" placeholder="Enter 6-digit code" required maxlength="6" autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password</label>
                        <div class="input-group">
                            <input name="newPassword" id="newPassword" type="password" class="form-control" placeholder="Create new password" required autocomplete="new-password">
                            <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('newPassword', this)">
                                👁️
                            </button>
                        </div>
                        <small class="text-muted d-block mt-1 fs-7">Must be 8+ chars with uppercase, lowercase, and a number.</small>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" id="resetBtn" class="btn btn-success btn-lg fw-bold">Set New Password</button>
                    </div>
                </form>
            </div>

            <div class="text-center border-top pt-3">
                <a href="/login.html" class="fw-bold text-decoration-none">← Back to Student Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const BACKEND_URL = (typeof API_BASE_URL !== 'undefined' && API_BASE_URL)
            ? API_BASE_URL
            : ((typeof API_BASE_URI !== 'undefined' && API_BASE_URI) ? API_BASE_URI : window.location.origin);

        const alertBox = document.getElementById('alertBox');
        const forgotForm = document.getElementById('forgotForm');
        const resetForm = document.getElementById('resetForm');
        const requestBtn = document.getElementById('requestBtn');
        const resetBtn = document.getElementById('resetBtn');

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        // Step 1: Request reset code & link
        forgotForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('reqEmail').value.trim();
            if (!email) return;

            requestBtn.disabled = true;
            requestBtn.textContent = 'Sending email...';
            alertBox.innerHTML = '';

            fetch(BACKEND_URL + '/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email })
            })
                .then(res => res.json())
                .then(data => {
                    requestBtn.disabled = false;
                    requestBtn.textContent = 'Send Reset Code & Link';

                    if (data.success) {
                        document.getElementById('step1').classList.add('d-none');
                        document.getElementById('step2').classList.remove('d-none');
                        document.getElementById('resetEmail').value = email;
                        alertBox.innerHTML = '<div class="alert alert-success">✅ Reset email sent! Please check your student email inbox for the 6-digit code or direct link.</div>';
                    } else {
                        alertBox.innerHTML = `<div class="alert alert-danger">${data.error || 'Failed to send reset email.'}</div>`;
                    }
                })
                .catch(() => {
                    requestBtn.disabled = false;
                    requestBtn.textContent = 'Send Reset Code & Link';
                    alertBox.innerHTML = '<div class="alert alert-danger">Could not connect to server. Please try again.</div>';
                });
        });

        // Step 2: Set new password
        resetForm.addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const resetCode = document.getElementById('resetCodeInput').value.trim();
            const newPassword = document.getElementById('newPassword').value;

            if (!/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/.test(newPassword)) {
                alertBox.innerHTML = '<div class="alert alert-danger">Password must be 8+ characters with uppercase, lowercase, and a number.</div>';
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Updating password...';
            alertBox.innerHTML = '';

            fetch(BACKEND_URL + '/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ email, resetCode, newPassword })
            })
                .then(res => res.json())
                .then(data => {
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Set New Password';

                    if (data.success) {
                        window.location.href = '/login.html?reset=success';
                    } else {
                        alertBox.innerHTML = `<div class="alert alert-danger">${data.error || 'Failed to reset password.'}</div>`;
                    }
                })
                .catch(() => {
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Set New Password';
                    alertBox.innerHTML = '<div class="alert alert-danger">Could not connect to server. Please try again.</div>';
                });
        });

        // Support direct reset link clicks from email: ?step=2&email=...&code=...
        const params = new URLSearchParams(window.location.search);
        if (params.get('step') === '2' || params.get('code')) {
            document.getElementById('step1').classList.add('d-none');
            document.getElementById('step2').classList.remove('d-none');
            const email = params.get('email') || '';
            const code = params.get('code') || '';
            document.getElementById('resetEmail').value = email;
            if (code) {
                document.getElementById('resetCodeInput').value = code;
                alertBox.innerHTML = '<div class="alert alert-info">Code verified from email link. Please enter your new password below.</div>';
            }
        }
    </script>
</body>

</html>
